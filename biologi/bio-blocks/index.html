<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bio-Blocks: kulhydrater, proteiner og fedt</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://3Dmol.org/build/3Dmol-min.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>
<!-- smbi hjem-knap -->
<a href="/" class="smbi-home" aria-label="Til forsiden" title="Til forsiden">
<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
<span>Hjem</span>
</a>
<style>
.smbi-home{position:fixed;top:14px;left:14px;z-index:2147483000;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;font:600 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#F5F0E8;background:#1C2E44;border:1px solid #2E4A6A;border-radius:999px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.28);opacity:.9;transition:opacity .15s,transform .15s}
.smbi-home:hover{opacity:1;transform:translateY(-1px)}
.smbi-home svg{flex:none}
@media print{.smbi-home{display:none!important}}
</style>
<script>(function(){try{if(window.top!==window.self){var e=document.querySelector(".smbi-home");if(e)e.style.display="none";}}catch(x){}})();</script>


<!-- Grupperne fyldes af js/ui.js ud fra det valgte modul — kun den faste
     gruppe er den samme for kulhydrater, proteiner og fedt. Hvor mange af
     dem der overhovedet bliver fyldt, afgør niveauvalget: se js/levels.js. -->
<header>
    <div class="group" id="grp-module"></div>
    <div class="group" id="grp-form"></div>
    <div class="group" id="grp-spawn"></div>
    <div class="group" id="grp-build"></div>
    <div class="group" id="grp-enzymes"></div>
    <div class="group" id="grp-repr"></div>

    <div class="group">
        <button class="chip" id="btn-tasks">🎯 Opgaver</button>
        <button class="chip" id="btn-log" title="Det du har bygget og svaret — til rapporten">📋 Min log</button>
        <button class="chip active" id="btn-numbers">C-numre</button>
        <div class="counter">💧 Vand: <b id="water-count">0</b></div>
        <button class="spawner btn-reset" id="btn-reset">Ryd bordet</button>
    </div>

    <!-- Niveauet står sidst: det er lærerens knap, ikke elevens -->
    <div class="group" id="grp-level"></div>
</header>

<div id="game-area">
    <svg id="svg-space" width="100%" height="100%">
        <!-- Farverne hører til modulets katalog, så gradienterne bygges af
             js/render.js når modulet skiftes -->
        <defs id="svg-defs">
            <filter id="soft-shadow" x="-30%" y="-30%" width="180%" height="180%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/>
            </filter>
        </defs>
        <g id="layer-molecules"></g>
        <g id="layer-enzymes"></g>
        <g id="layer-preview"></g>
        <g id="layer-fx"></g>
    </svg>
    <div id="status"></div>

    <!-- Startkortet på det tomme bord — fyldes af js/welcome.js, for hvad
         der skal stå, afhænger af modulet -->
    <div id="welcome" class="hidden"></div>

    <div id="task-panel" class="hidden">
        <div class="tp-head">
            <span>🎯 Opgaver</span>
            <button id="task-close" title="Luk opgavepanelet">✕</button>
        </div>
        <ol id="task-list"></ol>
        <div id="task-detail"></div>
    </div>
</div>

<div id="fact-modal" class="hidden">
    <div class="fact-box">
        <div class="fact-top" id="fact-top">
            <div>
                <h2 id="fact-name">Molekyle</h2>
                <span class="f-sub" id="fact-formula"></span>
            </div>
            <button id="fact-close" title="Luk">✕</button>
        </div>
        <div class="fact-rows" id="fact-rows"></div>
    </div>
</div>

<!-- Min log: hvad eleven har bygget og svaret — fyldes af js/log.js -->
<div id="log-modal" class="hidden">
    <div class="log-box">
        <div class="log-top">
            <div>
                <h2>📋 Min log</h2>
                <span class="f-sub" id="log-sub"></span>
            </div>
            <button id="log-close" title="Luk">✕</button>
        </div>
        <div class="log-body" id="log-body"></div>
        <div class="log-actions">
            <button class="tp-btn" id="log-copy">📋 Kopier til rapport</button>
            <button class="tp-btn grey" id="log-clear">Ryd loggen</button>
            <span class="log-warn">Loggen forsvinder, når du lukker fanen — kopiér den inden.</span>
        </div>
    </div>
</div>

<div id="viewer-modal" class="hidden">
    <div class="viewer-box">
        <div class="viewer-bar">
            <div>
                <span id="viewer-title">Molekyle</span>
                <span id="viewer-sub"></span>
            </div>
            <div class="viewer-actions">
                <button class="btn-small active" id="btn-spin">↻ Rotation</button>
                <button class="btn-small btn-close" id="viewer-close">Luk</button>
            </div>
        </div>
        <div id="viewer-container" class="viewer-container"></div>
        <p class="viewer-tip">Træk for at dreje · scroll for at zoome · rigtige 3D-koordinater fra PubChem</p>
    </div>
</div>

</body>
</html>
