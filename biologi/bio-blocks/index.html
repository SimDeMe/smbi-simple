<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bio-Blocks: kulhydrater, proteiner og fedt</title>
    <link rel="stylesheet" href="style.css">
    <script defer src="https://3Dmol.org/build/3Dmol-min.js"></script>
    <script type="module" src="js/main.js"></script>
</head>
<body>

<!-- Grupperne fyldes af js/ui.js ud fra det valgte modul — kun den sidste
     gruppe er den samme for kulhydrater, proteiner og fedt. -->
<header>
    <div class="group" id="grp-module"></div>
    <div class="group" id="grp-form"></div>
    <div class="group" id="grp-spawn"></div>
    <div class="group" id="grp-build"></div>
    <div class="group" id="grp-enzymes"></div>
    <div class="group" id="grp-repr"></div>

    <div class="group">
        <button class="chip" id="btn-tasks">🎯 Opgaver</button>
        <button class="chip active" id="btn-numbers">C-numre</button>
        <div class="counter">💧 Vand: <b id="water-count">0</b></div>
        <button class="spawner btn-reset" id="btn-reset">Ryd bordet</button>
    </div>
</header>

<div id="game-area">
    <svg id="svg-space" width="100%" height="100%">
        <!-- Farverne hører til modulets katalog, så gradienterne bygges af
             js/render.js når modulet skiftes -->
        <defs id="svg-defs">
            <filter id="soft-shadow" x="-30%" y="-30%" width="180%" height="180%">
                <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000" flood-opacity="0.28"/>
            </filter>
        </defs>
        <g id="layer-molecules"></g>
        <g id="layer-enzymes"></g>
        <g id="layer-preview"></g>
        <g id="layer-fx"></g>
    </svg>
    <div id="status"></div>

    <div id="task-panel" class="hidden">
        <div class="tp-head">
            <span>🎯 Opgaver</span>
            <button id="task-close" title="Luk opgavepanelet">✕</button>
        </div>
        <ol id="task-list"></ol>
        <div id="task-detail"></div>
    </div>
</div>

<div id="fact-modal" class="hidden">
    <div class="fact-box">
        <div class="fact-top" id="fact-top">
            <div>
                <h2 id="fact-name">Molekyle</h2>
                <span class="f-sub" id="fact-formula"></span>
            </div>
            <button id="fact-close" title="Luk">✕</button>
        </div>
        <div class="fact-rows" id="fact-rows"></div>
    </div>
</div>

<div id="viewer-modal" class="hidden">
    <div class="viewer-box">
        <div class="viewer-bar">
            <div>
                <span id="viewer-title">Molekyle</span>
                <span id="viewer-sub"></span>
            </div>
            <div class="viewer-actions">
                <button class="btn-small active" id="btn-spin">↻ Rotation</button>
                <button class="btn-small btn-close" id="viewer-close">Luk</button>
            </div>
        </div>
        <div id="viewer-container" class="viewer-container"></div>
        <p class="viewer-tip">Træk for at dreje · scroll for at zoome · rigtige 3D-koordinater fra PubChem</p>
    </div>
</div>

</body>
</html>
