  <meta name="apple-mobile-web-app-capable" content="yes" />

<body>
<!-- smbi hjem-knap -->
<a href="/" class="smbi-home" aria-label="Til forsiden" title="Til forsiden">
<svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></svg>
<span>Hjem</span>
</a>
<style>
.smbi-home{position:fixed;top:14px;left:14px;z-index:2147483000;display:inline-flex;align-items:center;gap:6px;padding:8px 13px;font:600 14px/1 system-ui,-apple-system,"Segoe UI",sans-serif;color:#F5F0E8;background:#1C2E44;border:1px solid #2E4A6A;border-radius:999px;text-decoration:none;box-shadow:0 2px 10px rgba(0,0,0,.28);opacity:.9;transition:opacity .15s,transform .15s}
.smbi-home:hover{opacity:1;transform:translateY(-1px)}
.smbi-home svg{flex:none}
@media print{.smbi-home{display:none!important}}
</style>
<script>(function(){try{if(window.top!==window.self){var e=document.querySelector(".smbi-home");if(e)e.style.display="none";}}catch(x){}})();</script>

  <div id="app"></div>
  <script type="module" src="js/app.js"></script>
</body>
